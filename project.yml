name: ASCTerminal
options:
  bundleIdPrefix: com.asc
  deploymentTarget:
    iOS: "15.0"
targets:
  ASCTerminal:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ASCTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asc.terminal
        INFOPLIST_FILE: ASCTerminal/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - framework: Frameworks/llama.xcframework

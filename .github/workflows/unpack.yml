name: First Round - Unpack Project ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - '.github/workflows/unpack.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2- || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _first_round
          mkdir -p _first_round
          unzip -q "${{ steps.zip.outputs.file }}" -d _first_round

          echo "Extracted tree:"
          find _first_round -maxdepth 4 -print | sort

      - name: Remove single wrapper folder
        shell: bash
        run: |
          set -euo pipefail

          shopt -s dotglob nullglob
          items=(_first_round/*)

          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            wrapper="${items[0]}"
            echo "Removing wrapper folder: $wrapper"

            temp_dir="$(mktemp -d)"
            mv "$wrapper"/* "$temp_dir"/ 2>/dev/null || true
            rm -rf _first_round
            mkdir -p _first_round
            mv "$temp_dir"/* _first_round/ 2>/dev/null || true
            rmdir "$temp_dir" 2>/dev/null || true
          fi

      - name: Copy parsed folders into repository
        shell: bash
        run: |
          set -euo pipefail

          shopt -s dotglob nullglob

          for item in _first_round/*; do
            name="$(basename "$item")"

            # Never let an uploaded ZIP overwrite our workflow control folder.
            if [ "$name" = ".github" ]; then
              echo "Skipping ZIP-provided .github folder"
              continue
            fi

            rm -rf "./$name"
            cp -a "$item" "./$name"
          done

          rm -rf _first_round

          echo "Repository after parse:"
          find . -maxdepth 4 \
            -not -path './.git/*' \
            -not -path './.git' \
            -print | sort

      - name: Commit parsed project folders
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Big Brother First Round"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "First round: unpack project ZIP"
          git push
